# Daily: pull new 10-Ks from EDGAR into the dataset (the `data` branch), then
# build the site and deploy it to Cloudflare. Pushes to main deploy too.
#
# Repository secrets needed:
#   SEC_USER_AGENT         "Your Name you@example.com" (EDGAR requires an email)
#   CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID
name: Update data and deploy

on:
  schedule:
    - cron: '30 7 * * *' # 07:30 UTC, after EDGAR publishes the previous day's index
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Check out the dataset
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch new 10-Ks
        if: github.event_name != 'push'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run update

      - name: Commit the dataset
        if: github.event_name != 'push'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "data: update through $(jq -r .lastDailyIndex state.json)"
          git push -q

      - run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
